name: Android build

on:
  push:
    # Pushing a tag like v1.0 also publishes the APK as a GitHub Release.
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Also validates the checksum of gradle/wrapper/gradle-wrapper.jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The build is pinned to compileSdk 36 and AGP 8.13's default build-tools (README "Toolchain").
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Restore permanent release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Configure the permanent release signing secrets (README)}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nav2pilot-release.keystore"

      - name: Unit tests, lint, signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nav2pilot-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease assembleDebugAndroidTest -PreleaseVersion="${GITHUB_REF_NAME#v}"

      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk'

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: nav2pilot-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nav2pilot-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/nav2pilot-release.keystore"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download signed release APK
        uses: actions/download-artifact@v7
        with:
          name: nav2pilot-release-apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mv app-release.apk "nav2pilot-$TAG.apk"
          gh release create "$TAG" "nav2pilot-$TAG.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nav2Pilot $TAG" \
            --generate-notes
